[project]
name = "garmin-pt"
version = "0.1.0"
description = "PT-datalag over Garmin Connect: daglig ingest til SQLite + kuratert MCP-server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "garminconnect==0.3.11",
    "mcp[cli]>=2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
totp = ["pyotp>=2.9"]

[project.scripts]
garmin-pt = "garmin_pt.cli:main"
garmin-pt-mcp = "garmin_pt.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_pt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
